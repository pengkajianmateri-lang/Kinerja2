<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catatan Kinerja</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#e8d9c8">
<style>
:root{--bg:#f1e6da;--tx:#3b2f2a;--mu:#8a766a;--ac:#8b6cf0;--ac2:#2cc7b8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,Roboto,sans-serif;color:var(--tx);min-height:100vh;padding:16px 16px 120px;background:radial-gradient(circle at 85% -5%,#e1d6ff,transparent 45%),radial-gradient(circle at 0 35%,#c8f1ea,transparent 35%),var(--bg)}
[hidden]{display:none!important}h1{font-size:22px}h2{font-size:15px;margin:18px 0 8px}small{color:var(--mu)}
.g{background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:20px;padding:14px;box-shadow:0 4px 18px rgba(90,60,40,.08);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}
.chip{border:0;border-radius:99px;padding:10px 16px;background:rgba(255,255,255,.6);color:var(--tx);font:inherit;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{font-size:34px;font-weight:700}
.r{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.r span{width:120px}.r i{flex:1;height:10px;background:#0001;border-radius:9px;overflow:hidden}.r b{display:block;height:100%;border-radius:9px}.r em{width:26px;text-align:right;font-style:normal}
.ca{background:linear-gradient(90deg,var(--ac),#b39bff)}.tl{background:linear-gradient(90deg,var(--ac2),#8de6dc)}
.tr{display:flex;align-items:flex-end;gap:2px;height:120px}.col{flex:1;height:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;position:relative;padding-bottom:14px}.col u{display:block;width:100%}.col small{position:absolute;bottom:0;font-size:9px;left:0}
.ins p{margin:6px 0}.card{margin:10px 0}.tag{font-size:11px;border-radius:99px;padding:2px 9px;color:#fff;margin-right:6px}
.card a{color:var(--ac)}.act{display:flex;gap:8px;margin-top:8px}.act button{flex:1;border:0;border-radius:12px;padding:10px;background:#fff9;font:inherit}
input,select,textarea{width:100%;font:inherit;padding:13px;border-radius:14px;border:1px solid #0002;background:#fffc;margin:6px 0}
.fil{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fil input:first-child{grid-column:1/3}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border-radius:26px;box-shadow:0 6px 24px rgba(60,40,30,.15);z-index:5}
nav button{border:0;background:0;font:inherit;color:var(--mu);width:34%;height:100%}nav button.on{color:var(--ac);font-weight:700}
#fab{width:64px;height:64px;margin-top:-30px;border-radius:50%;border:0;color:#fff;font-size:34px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 20px #8b6cf066}
#form,#login{position:fixed;inset:0;z-index:9;background:var(--bg);padding:16px;overflow:auto;animation:in .25s}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));margin-top:12px}.btn:disabled{opacity:.6}
.fr{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:0;font-size:28px}
#pv{max-width:100%;max-height:160px;border-radius:12px;margin-top:6px}
.up{display:block;text-align:center;background:#fffc;color:var(--tx);border:2px dashed var(--ac);font-size:16px}.up small{display:block;font-weight:400}
#pvw p,#dvw p{margin:6px 2px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;color:#fff;z-index:99;background:#2a9d8f;max-width:90%}#toast.e{background:#d64545}
.empty{text-align:center;color:var(--mu);padding:40px 10px}.sp{width:28px;height:28px;border:3px solid #0002;border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div id="login" hidden><h1 style="margin-top:20vh">Catatan Kinerja</h1><p style="margin:10px 0 24px;color:var(--mu)">Masukkan kunci akses pribadimu.</p><input id="lk" type="password" placeholder="Kunci akses" autocomplete="current-password"><button class="btn" id="lbtn">Masuk</button><p id="lerr" style="color:#d64545;margin-top:12px"></p></div>

<main>
<section id="home"><h1>Ringkasan</h1>
<div class="chips" id="pc"></div><div id="cust" hidden class="fil"><input type="date" id="cs"><input type="date" id="ce"></div>
<div id="hb"></div></section>
<section id="hist" hidden><h1>Riwayat</h1>
<div class="fil" style="margin-top:10px"><input id="q" placeholder="🔍 Cari kegiatan / catatan"><select id="fk"></select><input type="date" id="fd"></div><div id="hl"></div></section>
</main>

<nav><button id="n1" class="on">🏠<br><small>Beranda</small></button><button id="fab" aria-label="Tambah Catatan">+</button><button id="n2">🗂️<br><small>Riwayat</small></button></nav>

<div id="form" hidden><div class="fr"><h1 id="ft">Tambah Catatan</h1><button class="x" id="fx">×</button></div>
<div class="chips" id="jn"><button class="chip on" data-j="catatan">Catatan</button><button class="chip" data-j="tindak">Tindak Lanjut</button></div>
<input id="kg" placeholder="Kegiatan singkat" maxlength="200">
<div class="chips" id="kc" style="flex-wrap:wrap"></div>
<input type="date" id="tg">
<label class="btn up" id="fl">📷 Ambil foto / pilih gambar<small id="fh">Wajib untuk Catatan · disimpan ke folder Gambar</small><input type="file" id="fi" accept="image/*" hidden></label>
<div id="pvw"></div>
<label class="btn up" id="dl">📄 Tambah dokumen (Word, PDF, dll.)<small>Opsional · disimpan ke folder Dokumen</small><input type="file" id="di" accept=".pdf,.doc,.docx,.docm,.dot,.dotx,.rtf,.odt,.txt,.xls,.xlsx,.csv,.ppt,.pptx" hidden></label>
<div id="dvw"></div>
<textarea id="nt" rows="3" placeholder="Catatan (opsional)"></textarea>
<button class="btn" id="sv">Simpan</button></div>
<div id="toast" hidden></div>

<script>
// ===== KONFIGURASI (WAJIB DIISI) =====
const API='https://script.google.com/macros/s/AKfycbwpofLAYEhpZ21eC5F4tMuBJ1np-qv7Ok_wn1ZlpdD3adkk18zxR16NkHNxKpGQwrVMYg/exec';
// =====================================
const CATS=['Rapat','Kunjungan','Penyusunan Dokumen','Pembahasan','Finalisasi'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const JN={catatan:'Catatan',tindak:'Tindak Lanjut'};
let T=localStorage.t,items=[],per='month',jenis='catatan',cat='',img=null,doc=null,editId=null,loaded=false;
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
async function api(action,data){
 let j;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({token:T,action,data})});j=await r.json()}catch{throw new Error('Tidak ada koneksi / server tidak merespons')}
 if(!j.ok){if(j.error==='AUTH'||j.error==='LOCK'){login(j.error==='LOCK'?'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.':'Kunci akses salah.');throw new Error('Tidak bisa masuk')}throw new Error(j.error)}return j}
function login(m){T=null;items=[];localStorage.removeItem('t');localStorage.removeItem('c');$('#login').hidden=false;$('#lerr').textContent=m||'';home();hist()}
$('#lbtn').onclick=()=>{const k=$('#lk').value.trim();if(!k)return;T=k;$('#lk').value='';$('#login').hidden=true;load()};
$('#lk').onkeydown=e=>{if(e.key=='Enter')$('#lbtn').click()};
async function load(){$('#hb').innerHTML=$('#hl').innerHTML='<div class="sp"></div>';
 try{items=(await api('list')).items;localStorage.c=JSON.stringify(items);loaded=true;localStorage.t=T}catch(e){toast(e.message,1);try{items=JSON.parse(localStorage.c||'[]')}catch{}}
 home();hist()}

// ---- Periode
function range(){const n=new Date(),z=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());let a=z(n),b=z(n);
 if(per=='week'){a.setDate(a.getDate()-(a.getDay()+6)%7);b=new Date(a);b.setDate(a.getDate()+6)}
 if(per=='month'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
 if(per=='custom'){a=$('#cs').value?new Date($('#cs').value+'T00:00'):a;b=$('#ce').value?new Date($('#ce').value+'T00:00'):b}
 return[a,b]}
const inR=(x,a,b)=>x.tanggal>=fmt(a)&&x.tanggal<=fmt(b);
$('#pc').innerHTML=[['today','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['custom','Custom']].map(([k,l])=>`<button class="chip ${k==per?'on':''}" data-p="${k}">${l}</button>`).join('');
$('#pc').onclick=e=>{const p=e.target.dataset.p;if(!p)return;per=p;document.querySelectorAll('#pc .chip').forEach(c=>c.classList.toggle('on',c.dataset.p==p));$('#cust').hidden=p!='custom';home()};
$('#cs').onchange=$('#ce').onchange=home;
const bar=(l,v,m,c)=>`<div class="r"><span>${esc(l)}</span><i><b class="${c}" style="width:${v/m*100}%"></b></i><em>${v}</em></div>`;

function home(){
 if(!loaded&&!items.length&&!$('#hb').querySelector('.sp')){}
 const[a,b]=range(),days=Math.max(1,Math.round((b-a)/864e5)+1),cur=items.filter(x=>inR(x,a,b));
 const pa=new Date(a),pb=new Date(a);pa.setDate(a.getDate()-days);pb.setDate(a.getDate()-1);const prev=items.filter(x=>inR(x,pa,pb)).length;
 const c=cur.filter(x=>x.jenis=='catatan').length,t=cur.length-c;
 if(!cur.length){$('#hb').innerHTML=`<div class="grid"><div class="g"><small>Catatan</small><div class="big">0</div></div><div class="g"><small>Tindak Lanjut</small><div class="big">0</div></div></div><div class="empty">📭<br>Belum ada kegiatan pada periode ini.<br>Tekan <b>+</b> untuk menambah.</div>`;return}
 const ct={};cur.forEach(x=>{const k=x.kategori||'Tanpa Kategori';ct[k]=(ct[k]||0)+1});const cs=Object.entries(ct).sort((p,q)=>q[1]-p[1]);
 const el=Math.max(1,Math.min(days,Math.round((new Date()-a)/864e5)+1)),mon=days>62,bk={};
 if(!mon)for(let i=0;i<days;i++){const d=new Date(a);d.setDate(a.getDate()+i);bk[fmt(d)]=[0,0]}
 cur.forEach(x=>{const k=mon?x.tanggal.slice(0,7):x.tanggal;bk[k]=bk[k]||[0,0];bk[k][x.jenis=='catatan'?0:1]++});
 const ks=Object.keys(bk).sort(),mx=Math.max(1,...ks.map(k=>bk[k][0]+bk[k][1]));
 const diff=prev?Math.round((cur.length-prev)/prev*100):null;
 $('#hb').innerHTML=`<div class="grid"><div class="g"><small>Catatan</small><div class="big">${c}</div></div><div class="g"><small>Tindak Lanjut</small><div class="big">${t}</div></div></div>
 <h2>💡 Insight</h2><div class="g ins"><p>Kategori terbanyak: <b>${esc(cs[0][0])}</b> (${cs[0][1]} kegiatan)</p><p>Rata-rata per hari: <b>${(cur.length/el).toFixed(1)}</b> kegiatan</p>
 <p>Dibanding periode sebelumnya (${prev}): <b>${diff===null?'belum ada pembanding':(diff>=0?'▲ ':'▼ ')+Math.abs(diff)+'%'}</b></p></div>
 <h2>Kegiatan per kategori</h2><div class="g">${cs.map(([k,v])=>bar(k,v,cs[0][1],'ca')).join('')}</div>
 <h2>Tren ${mon?'bulanan':'harian'}</h2><div class="g"><div class="tr">${ks.map((k,i)=>`<div class="col" title="${k}: ${bk[k][0]+bk[k][1]}"><u class="tl" style="height:${bk[k][1]/mx*100}%"></u><u class="ca" style="height:${bk[k][0]/mx*100}%"></u><small>${i%(mon?2:5)==0?(mon?k.slice(2):k.slice(8)):''}</small></div>`).join('')}</div><small>■ Catatan &nbsp;<span style="color:var(--ac2)">■</span> Tindak Lanjut</small></div>
 <h2>Catatan vs Tindak Lanjut</h2><div class="g">${bar('Catatan',c,Math.max(c,t,1),'ca')}${bar('Tindak Lanjut',t,Math.max(c,t,1),'tl')}</div>`}

// ---- Riwayat
$('#fk').innerHTML='<option value="">Semua kategori</option>'+CATS.map(k=>`<option>${k}</option>`).join('');
['q','fk','fd'].forEach(i=>$('#'+i).oninput=hist);
function hist(){const q=$('#q').value.toLowerCase(),k=$('#fk').value,d=$('#fd').value;
 const l=items.filter(x=>(!k||x.kategori==k)&&(!d||x.tanggal==d)&&(!q||(x.kegiatan+' '+x.note).toLowerCase().includes(q))).sort((p,q)=>q.tanggal.localeCompare(p.tanggal)||(+q.id)-(+p.id));
 $('#hl').innerHTML=l.length?l.slice(0,200).map(x=>`<div class="g card"><span class="tag ${x.jenis=='catatan'?'ca':'tl'}">${JN[x.jenis]}</span><small>${x.tanggal}${x.kategori?' · '+esc(x.kategori):''}</small>
 <div style="margin-top:6px"><b>${esc(x.kegiatan)}</b></div>${x.note?`<div>${esc(x.note)}</div>`:''}${/^http/.test(x.gambar)?`<a href="${esc(x.gambar)}" target="_blank" rel="noopener">📎 Lihat gambar</a> `:''}${/^http/.test(x.dokumen)?`<a href="${esc(x.dokumen)}" target="_blank" rel="noopener">📄 Buka dokumen</a>`:''}
 <div class="act"><button data-e="${x.id}">✏️ Edit</button><button data-d="${x.id}">🗑️ Hapus</button></div></div>`).join(''):'<div class="empty">🔎<br>Tidak ada data yang cocok.</div>'}
$('#hl').onclick=async e=>{const id=e.target.dataset.e||e.target.dataset.d,x=items.find(i=>i.id==id);if(!x)return;
 if(e.target.dataset.e)return openForm(x);
 if(!confirm('Hapus kegiatan ini?\n\n'+x.kegiatan+'\n\nBaris di indeks dihapus dan tidak bisa dibatalkan. File di folder Gambar/Dokumen tidak ikut terhapus.'))return;
 try{await api('delete',{id:x.id,jenis:x.jenis,oldKegiatan:x.kegiatan});toast('Terhapus ✓');load()}catch(er){toast(er.message,1)}};

// ---- Navigasi
function tab(n){$('#home').hidden=n!=1;$('#hist').hidden=n!=2;$('#n1').classList.toggle('on',n==1);$('#n2').classList.toggle('on',n==2);scrollTo(0,0)}
$('#n1').onclick=()=>tab(1);$('#n2').onclick=()=>tab(2);

// ---- Form
$('#kc').innerHTML=CATS.map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('');
$('#kc').onclick=e=>{if(!e.target.dataset.k)return;cat=e.target.dataset.k;document.querySelectorAll('#kc .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==cat))};
$('#jn').onclick=e=>{if(!e.target.dataset.j||editId)return;setJ(e.target.dataset.j)};
const setJ=j=>{jenis=j;document.querySelectorAll('#jn .chip').forEach(c=>c.classList.toggle('on',c.dataset.j==j))};
function openForm(x){editId=x?x.id:null;img=null;doc=null;
 $('#pvw').innerHTML=x&&x.gambar?'<p><small>📎 Gambar sudah tersimpan. Pilih lagi hanya jika ingin menggantinya.</small></p>':'';
 $('#dvw').innerHTML=x&&x.dokumen?'<p><small>📄 Dokumen sudah tersimpan. Pilih lagi hanya jika ingin menggantinya.</small></p>':'';$('#di').value='';$('#ft').textContent=x?'Edit Kegiatan':'Tambah Catatan';
 setJ(x?x.jenis:'catatan');$('#kg').value=x?x.kegiatan:'';$('#nt').value=x?x.note:'';$('#tg').value=x?x.tanggal:fmt(new Date());$('#fi').value='';
 cat=x?x.kategori:'';document.querySelectorAll('#kc .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==cat));$('#form').hidden=false}
$('#fab').onclick=()=>openForm();$('#fx').onclick=()=>$('#form').hidden=true;
const rd=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){toast('Pilih file gambar (JPG/PNG)',1);e.target.value='';return}
 const u=await new Promise(ok=>{const i=new Image(),src=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(src);ok(c.toDataURL('image/jpeg',.75))};i.onerror=()=>ok(null);i.src=src});
 if(!u){toast('Gambar tidak bisa dibaca, coba file lain',1);return}
 img={b64:u.split(',')[1],mime:'image/jpeg',name:f.name};$('#pvw').innerHTML=`<img id="pv" src="${u}">`};
$('#di').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(f.size>15e6){toast('Dokumen terlalu besar (maks 15 MB)',1);e.target.value='';return}
 doc={b64:(await rd(f)).split(',')[1],mime:f.type||'application/octet-stream',name:f.name};$('#dvw').innerHTML='<p>📄 '+esc(f.name)+'</p>'};
$('#sv').onclick=async()=>{const kg=$('#kg').value.trim(),old=editId&&items.find(x=>x.id==editId);
 if(!kg)return toast('Isi kegiatan dulu',1);if(!cat)return toast('Pilih kategori',1);
 if(jenis=='catatan'&&!img&&!(old&&old.gambar))return toast('Catatan kegiatan wajib disertai gambar',1);
 const b=$('#sv');b.disabled=true;b.textContent='Menyimpan…';
 try{await api(editId?'update':'add',{id:editId,jenis,oldKegiatan:old&&old.kegiatan,kegiatan:kg,kategori:cat,tanggal:$('#tg').value,note:$('#nt').value.trim(),image:img&&img.b64,mime:img&&img.mime,fname:img&&img.name,doc:doc&&doc.b64,dmime:doc&&doc.mime,dname:doc&&doc.name});
  toast('Berhasil disimpan ✓');$('#form').hidden=true;await load()}catch(e){toast('Gagal: '+e.message,1)}
 b.disabled=false;b.textContent='Simpan'};

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
if(T){try{items=JSON.parse(localStorage.c||'[]')}catch{}home();hist();load()}else login()
</script>
</body></html>
